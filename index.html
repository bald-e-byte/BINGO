<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo</title>
<meta name="description" content="Two players. Build your own board. First to 5 lines wins.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bingo">
<meta property="og:description" content="Two players. Build your own board. First to 5 lines wins.">
<meta property="og:url" content="https://bald-e-byte.github.io/BINGO/">
<meta property="og:image" content="https://bald-e-byte.github.io/BINGO/bingo.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://bald-e-byte.github.io/BINGO/bingo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF3F6;--grid:#CBD9E4;--ink:#22314A;--pencil:#8A98A8;--hint:#FFF1A6;--red:#D62839;--wob:255px 14px 225px 14px/14px 225px 14px 255px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:20px;color:var(--ink);background:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
min-height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{width:100%;flex:1;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#app{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;gap:10px}#mute{margin-left:auto}[hidden]{display:none!important}
h1{font-size:46px;line-height:1;margin:6px 0 0;font-weight:400}
p{margin:0}.note{color:var(--pencil)}.err{color:var(--red)}
.btn,input{font:inherit;font-size:22px;min-height:54px;padding:8px 16px;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:var(--wob);width:100%}
.btn{cursor:pointer;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;font-size:28px;min-height:64px;animation:pop .5s ease-out}
.btn.mute{width:auto;min-height:40px;font-size:18px;padding:2px 16px;border-width:2px}
.btn:disabled{opacity:.45}
input{text-transform:none}input.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.row{display:flex;gap:10px}.row>*{flex:1}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell,.chip{font:inherit;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:var(--wob);padding:0;touch-action:manipulation}
.cell{aspect-ratio:1;font-size:30px}
.chip{min-height:46px;font-size:22px;border-width:2px}
.chip:disabled{opacity:.5}
.cell.sel{outline:3px dashed var(--red);outline-offset:2px}
/* play board: padded wrappers so line coordinates are exact */
.bd{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:-4px}
.cw{aspect-ratio:1;padding:4px}
.cw .cell{width:100%;height:100%;aspect-ratio:auto}
.cell.can{box-shadow:0 0 0 3px #FFD3D8}
.cell.hint{background:var(--hint)}
.cell.mk{color:var(--pencil);background:#fff linear-gradient(to top right,transparent calc(50% - 1.5px),var(--ink) calc(50% - 1.5px),var(--ink) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.strikes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.strikes path{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round;opacity:.85}
.strikes path.fresh{stroke-dasharray:1;animation:draw .45s ease-out}
.letters{display:flex;gap:8px;justify-content:center}
.letters span{position:relative;width:54px;height:62px;display:grid;place-items:center;font-size:42px;background:#fff;border:2.5px solid var(--ink);border-radius:var(--wob)}
.letters span.on{color:var(--pencil);border-color:var(--pencil)}
.letters span.on::after{content:"";position:absolute;left:-5px;right:-5px;top:50%;height:5px;margin-top:-2px;border-radius:5px;background:var(--red);opacity:.9;transform:rotate(-14deg)}
.letters span.fresh::after{transform-origin:left center;animation:swipe .35s ease-out}
.turn{font-size:24px;text-align:center}
.big{font-size:64px;line-height:1.05;text-align:center}
.code{font-size:26px}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes swipe{from{transform:scaleX(0) rotate(-14deg)}to{transform:scaleX(1) rotate(-14deg)}}
@media (prefers-reduced-motion:reduce){.btn.red,.strikes path.fresh,.letters span.fresh::after{animation:none}}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
footer{text-align:center;margin-top:18px}
footer a{display:inline-block;padding:12px 10px;color:var(--pencil);text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="bar"><button id="leave" class="btn mute" data-act="leave" hidden>Leave room</button><button id="mute" class="btn mute" data-act="mute">Sound on</button></div>
  <div id="app"><p>Connecting…</p></div>
</main>
<footer><a href="https://bald-e.neocities.org" target="_blank" rel="noopener">© bald-e 2026</a></footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,onValue,onChildAdded,set,update,get} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8QJgzDG8LxhrJJBvIBbhVl4M7UUaehSQ",
  authDomain: "bingo-c9ea8.firebaseapp.com",
  databaseURL: "https://bingo-c9ea8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bingo-c9ea8",
  storageBucket: "bingo-c9ea8.firebasestorage.app",
  messagingSenderId: "1030829494615",
  appId: "1:1030829494615:web:c8a164cebe50b1e7902e12"
};

const app = initializeApp(firebaseConfig), db = getDatabase(app), auth = getAuth(app);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NUMS = Array.from({length:25}, (_, i) => i + 1);

// the 12 winning lines (5 rows, 5 columns, 2 diagonals)
const LINES = [];
for (let r = 0; r < 5; r++) {
  LINES.push([0,1,2,3,4].map(c => r*5 + c));
  LINES.push([0,1,2,3,4].map(c => c*5 + r));
}
LINES.push([0,6,12,18,24], [4,8,12,16,20]);

// ---------- sound (synthesized, no files) ----------
let AC = null, muted = false;
try { muted = localStorage.getItem("bingo-mute") === "1"; } catch (e) {}
const actx = () => {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
};
function tone(f, d = .12, type = "sine", v = .15, at = 0) {
  if (muted) return;
  const a = actx(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function scratch() { // pencil strike
  if (muted) return;
  const a = actx(); if (!a) return;
  const len = a.sampleRate * .14 | 0, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = "bandpass"; f.frequency.value = 3200; f.Q.value = .8; g.gain.value = .35;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  tap: () => tone(660, .06, "triangle", .12),
  scratch,
  call: () => { tone(420, .09, "square", .07); tone(630, .12, "square", .07, .08); },
  turn: (d = 0) => { tone(784, .14, "sine", .18, d); tone(1047, .22, "sine", .18, d + .12); },
  lock: () => tone(180, .18, "triangle", .25),
  nope: () => tone(150, .12, "sawtooth", .07),
  line: () => [523, 659, 784].forEach((f, i) => tone(f, .18, "triangle", .18, i*.09)),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .2, i*.12)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .3, "sine", .18, i*.18))
};
$("#mute").textContent = muted ? "Sound off" : "Sound on";

// ---------- state ----------
const S = {uid:null, code:null, name:"", codeIn:"", err:"", host:null, players:{}, ready:{}, status:null, turn:null,
  called:{}, last:null, claim:null, boards:{}, board:Array(25).fill(0), sel:0, marked:Array(25).fill(false),
  starting:false, watching:false, busy:false, drawn:new Set(), lineSnd:0, endPlayed:false, shownL:0, again:{}, left:{}, resetting:false};

const valid = b => Array.isArray(b) && b.length === 25 && new Set(b).size === 25 && b.every(n => Number.isInteger(n) && n >= 1 && n <= 25);
const nameOf = u => S.players[u] ? esc(S.players[u]) : "Opponent";
const otherUid = u => Object.keys(S.players).find(x => x !== u);
const fail = e => { S.err = e.message || String(e); render(); };
const lineCount = () => LINES.filter(l => l.every(i => S.marked[i])).length;
const oppLeft = () => { const o = otherUid(S.uid); return o && S.left[o] ? o : null; };
const leftNote = () => oppLeft() ? `<p class="err">${nameOf(oppLeft())} left the room.</p>` : "";

// ---------- screens ----------
function home() {
  return `<h1>Bingo</h1>
  <p class="note">Two players. Build your own board. First to 5 lines wins.</p>
  <input id="name" placeholder="Your name" maxlength="16" value="${esc(S.name)}" autocomplete="off">
  <button class="btn pri" data-act="create">Create a room</button>
  <p class="note" style="text-align:center">or join a friend</p>
  <div class="row"><input id="codeIn" class="code" placeholder="CODE" maxlength="4" value="${esc(S.codeIn)}" autocomplete="off"><button class="btn" data-act="join">Join room</button></div>
  <p class="err">${esc(S.err)}</p>`;
}

function lobby() {
  const o = Object.entries(S.players).find(([u]) => u !== S.uid);
  const locked = S.ready[S.uid];
  let h = `<h1>Room <span class="code">${S.code}</span></h1>
  <p class="note">${o ? esc(o[1]) + " is here." : "Share this code with your friend."}</p>${leftNote()}`;
  if (locked) {
    h += `<p>Board locked. ${Object.keys(S.ready).length === 2 ? "Starting…" : "Waiting for the other player to lock theirs."}</p>`;
    h += `<div class="g5">${S.board.map(n => `<div class="cell" style="display:grid;place-items:center">${n}</div>`).join("")}</div>`;
  } else {
    const used = new Set(S.board);
    h += `<p>Tap a square, then tap a number. Use each number 1–25 once.</p>`;
    h += `<div class="g5">${S.board.map((n, i) => `<button class="cell ${S.sel === i ? "sel" : ""}" data-act="cell" data-v="${i}">${n || ""}</button>`).join("")}</div>`;
    h += `<div class="g5">${NUMS.map(n => `<button class="chip" data-act="pick" data-v="${n}" ${used.has(n) ? "disabled" : ""}>${n}</button>`).join("")}</div>`;
    h += `<div class="row"><button class="btn" data-act="shuffle">Randomize</button><button class="btn pri" data-act="lock" ${valid(S.board) ? "" : "disabled"}>Lock board</button></div>`;
  }
  return h + `<p class="err">${esc(S.err)}</p>`;
}

// red marker strokes over every completed row, column or diagonal
function strikes() {
  const out = [];
  LINES.forEach((l, k) => {
    if (!l.every(i => S.marked[i])) { S.drawn.delete(k); return; }
    const pt = i => [(i % 5 + .5)*20, (Math.floor(i/5) + .5)*20];
    let [x1, y1] = pt(l[0]), [x2, y2] = pt(l[4]);
    const dx = (x2 - x1)/4, dy = (y2 - y1)/4, len = Math.hypot(dx, dy);
    x1 -= dx*.4; y1 -= dy*.4; x2 += dx*.4; y2 += dy*.4;
    const j = ((k*37) % 7 - 3)*.35;
    const mx = (x1 + x2)/2 - dy/len*j, my = (y1 + y2)/2 + dx/len*j;
    const fresh = !S.drawn.has(k); S.drawn.add(k);
    out.push(`<path class="${fresh ? "fresh" : ""}" pathLength="1" d="M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}"/>`);
  });
  return `<svg class="strikes" viewBox="0 0 100 100" aria-hidden="true">${out.join("")}</svg>`;
}

function play() {
  const myTurn = S.turn === S.uid, L = lineCount(), o = otherUid(S.uid), prevL = S.shownL;
  S.shownL = L;
  let h = `<div class="letters">${[..."BINGO"].map((c, i) => `<span class="${i < L ? (i >= prevL ? "on fresh" : "on") : ""}">${c}</span>`).join("")}</div>`;
  h += `<p class="turn">${myTurn ? "Your turn. Tap a number on your board to call it." : "Waiting for " + nameOf(o) + "…"}</p>${leftNote()}`;
  if (S.last) h += `<p class="note" style="text-align:center">Last called: ${S.last} by ${S.called[S.last] === S.uid ? "you" : nameOf(S.called[S.last])}</p>`;
  h += `<div class="bd">${S.board.map((n, i) => {
    const cls = S.marked[i] ? "mk" : S.called[n] ? "hint" : myTurn ? "can" : "";
    return `<div class="cw"><button class="cell ${cls}" data-act="tap" data-v="${i}">${n}</button></div>`;
  }).join("")}${strikes()}</div>`;
  h += `<p class="note" style="text-align:center">Called numbers glow yellow. Tap one to strike it off.</p>`;
  if (L >= 5) h += `<button class="btn red" data-act="claim">SHOUT BINGO!</button>`;
  return h + `<p class="err">${esc(S.err)}</p>`;
}

function verdict() {
  const ids = Object.keys(S.players);
  if (!S.claim || !ids.every(u => S.boards[u])) return null;
  const c = S.claim, b = Array.from(S.boards[c]);
  const ok = valid(b) && LINES.filter(l => l.every(i => S.called[b[i]])).length >= 5;
  return {c, ok, winner: ok ? c : otherUid(c)};
}

function over() {
  const v = verdict();
  if (!v) return `<p>Checking the boards…</p>`;
  const o = otherUid(S.uid);
  let h = `<h1 class="big">${v.winner === S.uid ? "You win!" : nameOf(v.winner) + " wins"}</h1>
  <p class="turn">${v.ok ? nameOf(v.c) + " completed 5 lines." : nameOf(v.c) + " shouted BINGO without 5 lines."}</p>`;
  if (oppLeft()) h += leftNote();
  else if (S.again[S.uid]) h += `<p class="turn">Waiting for ${nameOf(o)} to play again…</p>`;
  else h += `${S.again[o] ? `<p class="note" style="text-align:center">${nameOf(o)} wants a rematch.</p>` : ""}<button class="btn pri" data-act="again">Play again</button>`;
  return h + `<p class="err">${esc(S.err)}</p>`;
}

function render() {
  maybeStart();
  maybeReset();
  if (!S.uid) return;
  $("#leave").hidden = !S.code;
  const v = verdict();
  if (v && !S.endPlayed) { S.endPlayed = true; (v.winner === S.uid ? sfx.win : sfx.lose)(); }
  if (S.code && !S.claim && S.status === "playing") {
    const L = lineCount();
    if (L > S.lineSnd) sfx.line();
    S.lineSnd = L;
  }
  $("#app").innerHTML = !S.code ? home() : S.claim ? over() : S.status === "playing" ? play() : lobby();
}

// ---------- firebase ----------
const R = p => ref(db, `rooms/${S.code}/${p}`);
let unsubs = [];

function enter(code) {
  S.code = code; S.err = ""; S.sel = 0;
  const on = (p, fn) => unsubs.push(onValue(R(p), s => { fn(s.val()); render(); }, fail));
  on("host", v => S.host = v);
  on("players", v => S.players = v || {});
  on("ready", v => S.ready = v || {});
  on("status", v => S.status = v);
  on("turn", v => {
    const prev = S.turn; S.turn = v;
    if (v !== S.uid) S.busy = false;
    if (v === S.uid && prev !== S.uid) sfx.turn(prev ? .28 : 0);
  });
  on("claim", v => { if (!v && S.claim) resetLocal(); S.claim = v; if (v && !S.watching) watchBoards(); });
  on("again", v => S.again = v || {});
  on("left", v => S.left = v || {});
  on(`boards/${S.uid}`, v => { const b = v && Array.from(v); if (valid(b)) S.board = b; });
  unsubs.push(onChildAdded(R("called"), s => { S.called[s.key] = s.val(); S.last = +s.key; sfx.call(); render(); }, fail));
}

let boardUnsubs = [];
function watchBoards() {
  S.watching = true;
  Object.keys(S.players).forEach(u =>
    boardUnsubs.push(onValue(R(`boards/${u}`), s => { if (s.val()) { S.boards[u] = s.val(); render(); } }, () => {})));
}

// new round: wipe local game state (players stay in the room)
function resetLocal() {
  boardUnsubs.forEach(u => u()); boardUnsubs = [];
  Object.assign(S, {called:{}, last:null, boards:{}, board:Array(25).fill(0), marked:Array(25).fill(false), sel:0,
    watching:false, starting:false, busy:false, lineSnd:0, shownL:0, endPlayed:false, resetting:false});
  S.drawn.clear();
}

// host clears the round once both players tapped "Play again"
function maybeReset() {
  const ids = Object.keys(S.players);
  if (S.host && S.host === S.uid && S.claim && !S.resetting && ids.length === 2 && ids.every(u => S.again[u])) {
    S.resetting = true;
    const u = {status: null, turn: null, claim: null};
    ids.forEach(p => { u[`boards/${p}`] = null; u[`ready/${p}`] = null; u[`again/${p}`] = null; });
    Object.keys(S.called).forEach(n => { u[`called/${n}`] = null; });
    update(ref(db, `rooms/${S.code}`), u).catch(e => { S.resetting = false; fail(e); });
  }
}

// the host starts the game once both boards are locked
function maybeStart() {
  if (S.host && S.host === S.uid && !S.status && !S.starting && Object.keys(S.ready).length === 2) {
    S.starting = true;
    update(ref(db, `rooms/${S.code}`), {status: "playing", turn: S.uid}).catch(e => { S.starting = false; fail(e); });
  }
}

const genCode = () => Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join("");
const readName = () => { S.name = ($("#name")?.value || "").trim(); S.codeIn = ($("#codeIn")?.value || "").trim().toUpperCase(); return S.name; };

const ACT = {
  async create() {
    if (!readName()) { S.err = "Enter your name first."; return render(); }
    let last;
    for (let i = 0; i < 5; i++) {
      const code = genCode();
      try {
        await set(ref(db, `rooms/${code}/host`), S.uid);
        await set(ref(db, `rooms/${code}/players/${S.uid}`), S.name);
        return enter(code);
      } catch (e) { last = e; }
    }
    fail(last);
  },
  async join() {
    if (!readName()) { S.err = "Enter your name first."; return render(); }
    if (S.codeIn.length !== 4) { S.err = "Room codes have 4 letters."; return render(); }
    try {
      const h = await get(ref(db, `rooms/${S.codeIn}/host`));
      if (!h.exists()) { S.err = "No room with that code."; return render(); }
      const g = await get(ref(db, `rooms/${S.codeIn}/guest`));
      const isHost = h.val() === S.uid;
      if (g.exists() && g.val() !== S.uid && !isHost) { S.err = "That room is full."; return render(); }
      if (!g.exists() && !isHost) await set(ref(db, `rooms/${S.codeIn}/guest`), S.uid);
      await set(ref(db, `rooms/${S.codeIn}/players/${S.uid}`), S.name);
      await set(ref(db, `rooms/${S.codeIn}/left/${S.uid}`), null);
      enter(S.codeIn);
    } catch (e) { S.err = "Couldn't join. The room may be full."; render(); }
  },
  cell(v) {
    const i = +v;
    sfx.tap();
    if (S.sel === i && S.board[i]) S.board[i] = 0; else S.sel = i;
    render();
  },
  pick(v) {
    sfx.tap();
    S.board[S.sel] = +v;
    const next = S.board.findIndex((n, i) => i > S.sel && !n);
    S.sel = next >= 0 ? next : Math.max(S.board.indexOf(0), 0);
    render();
  },
  shuffle() {
    sfx.tap();
    const a = [...NUMS];
    for (let i = 24; i > 0; i--) { const j = Math.random()*(i+1)|0; [a[i], a[j]] = [a[j], a[i]]; }
    S.board = a; render();
  },
  async lock() {
    if (!valid(S.board)) return;
    sfx.lock();
    try {
      await set(R(`boards/${S.uid}`), S.board);
      await set(R(`ready/${S.uid}`), true);
    } catch (e) { fail(e); }
  },
  // already called: strike it off (or undo). Not called yet: on your turn, this calls it.
  tap(v) {
    const i = +v, n = S.board[i];
    if (S.called[n]) { S.marked[i] = !S.marked[i]; S.marked[i] ? sfx.scratch() : sfx.tap(); return render(); }
    if (S.turn !== S.uid || S.busy) return sfx.nope();
    S.busy = true; S.marked[i] = true; sfx.scratch(); render();
    update(ref(db, `rooms/${S.code}`), {[`called/${n}`]: S.uid, turn: otherUid(S.uid)})
      .catch(e => { S.busy = false; S.marked[i] = false; fail(e); });
  },
  claim() { set(R("claim"), S.uid).catch(fail); },
  again() { sfx.tap(); set(R(`again/${S.uid}`), true).catch(fail); },
  async leave() {
    if (S.status === "playing" && !S.claim && !confirm("Leave this game? Your friend will be left waiting.")) return;
    try { await set(R(`left/${S.uid}`), true); } catch (e) {}
    unsubs.forEach(u => u()); boardUnsubs.forEach(u => u());
    location.reload();
  },
  mute() {
    muted = !muted;
    try { localStorage.setItem("bingo-mute", muted ? "1" : "0"); } catch (e) {}
    $("#mute").textContent = muted ? "Sound off" : "Sound on";
    sfx.tap();
  }
};

document.addEventListener("click", e => {
  actx(); // unlock audio on the first tap
  const t = e.target.closest("[data-act]");
  if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset.v);
});

signInAnonymously(auth).then(c => { S.uid = c.user.uid; render(); })
  .catch(e => { $("#app").innerHTML = `<h1>Bingo</h1><p class="err">Couldn't sign in: ${esc(e.message)}</p><p class="note">Check your Firebase config and that Anonymous sign-in is enabled.</p>`; });
</script>
</body>
</html>
